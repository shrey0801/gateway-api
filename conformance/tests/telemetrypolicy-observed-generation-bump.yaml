apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-telemetrypolicy-observed-generation-bump
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: "{GATEWAY_CLASS_NAME}"
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    hostname: observed-generation-bump.telemetrypolicy.example.com
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: telemetrypolicy-observed-generation-bump
  namespace: gateway-conformance-infra
spec:
  parentRefs:
  - name: gateway-telemetrypolicy-observed-generation-bump
    namespace: gateway-conformance-infra
  hostnames:
  - observed-generation-bump.telemetrypolicy.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /telemetrypolicy-observed-generation-bump
    backendRefs:
    - group: ""
      kind: Service
      name: infra-backend-v1
      port: 8080
---
apiVersion: gateway.networking.x-k8s.io/v1alpha1
kind: XTelemetryPolicy
metadata:
  name: observed-generation-bump
  namespace: gateway-conformance-infra
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gateway-telemetrypolicy-observed-generation-bump
  tracing:
    mode: ImplementationDefault
