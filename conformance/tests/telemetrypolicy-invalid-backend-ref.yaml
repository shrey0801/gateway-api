apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-telemetrypolicy-backend-not-found
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: "{GATEWAY_CLASS_NAME}"
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    hostname: backend-not-found.telemetrypolicy.example.com
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: telemetrypolicy-backend-not-found
  namespace: gateway-conformance-infra
spec:
  parentRefs:
  - name: gateway-telemetrypolicy-backend-not-found
    namespace: gateway-conformance-infra
  hostnames:
  - backend-not-found.telemetrypolicy.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /telemetrypolicy-backend-not-found
    backendRefs:
    - group: ""
      kind: Service
      name: infra-backend-v1
      port: 8080
---
apiVersion: gateway.networking.x-k8s.io/v1alpha1
kind: XTelemetryPolicy
metadata:
  name: backend-not-found
  namespace: gateway-conformance-infra
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gateway-telemetrypolicy-backend-not-found
  tracing:
    mode: Enabled
    provider:
      backendRef:
        group: ""
        kind: Service
        name: nonexistent-collector
        port: 4317
---
